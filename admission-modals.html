<!-- Admission Note View Modal (Read-only) -->
<div id="admissionNoteViewModal"
    class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative bg-white w-full max-w-2xl rounded-xl shadow-2xl p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">
                <i class="fas fa-eye text-blue-600 mr-2"></i>ข้อมูลประวัติแรกรับ (Admission Note)
            </h2>
            <button type="button" data-action="closeAdmissionNoteViewModal" class="text-gray-400 hover:text-gray-600" aria-label="ปิด">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <div class="space-y-4 bg-gray-50 p-4 rounded-lg">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">CC (อาการสำคัญ)</label>
                <div id="viewCC" class="bg-white border border-gray-200 rounded-lg p-3 text-base text-gray-800 min-h-[44px]"></div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">HPI (อาการปัจจุบัน)</label>
                <div id="viewHPI" class="bg-white border border-gray-200 rounded-lg p-3 text-base text-gray-800 min-h-[60px] whitespace-pre-wrap"></div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">PH (ความเจ็บป่วยก่อนหน้า)</label>
                    <div id="viewPMH" class="bg-white border border-gray-200 rounded-lg p-3 text-base text-gray-800 min-h-[60px] whitespace-pre-wrap"></div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">FHx (ประวัติครอบครัว)</label>
                    <div id="viewFHx" class="bg-white border border-gray-200 rounded-lg p-3 text-base text-gray-800 min-h-[60px] whitespace-pre-wrap"></div>
                </div>
            </div>
        </div>
        
        <div class="flex justify-end space-x-3 mt-6">
            <button type="button" data-action="closeAdmissionNoteViewModal"
                class="px-5 py-3 bg-gray-100 text-gray-800 rounded-lg hover:bg-gray-200 font-bold">
                ปิด
            </button>
        </div>
    </div>
</div>

<!-- Admission Orders View Modal (Read-only) -->
<div id="admissionOrdersViewModal"
    class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative bg-white w-full max-w-2xl rounded-xl shadow-2xl p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">
                <i class="fas fa-clipboard-list text-amber-600 mr-2"></i>แผนการรักษาแรกรับ (Admission Orders)
            </h2>
            <button type="button" data-action="closeAdmissionOrdersViewModal" class="text-gray-400 hover:text-gray-600" aria-label="ปิด">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <div class="space-y-4 bg-gray-50 p-4 rounded-lg">
            <div>
                <label class="block text-sm font-bold text-amber-700 mb-1">
                    <i class="fas fa-hourglass-half mr-1"></i>คำสั่งวันเดียว (One Day Order)
                </label>
                <div id="viewOneDay" class="bg-white border border-gray-200 rounded-lg p-3 text-base text-gray-800 font-mono min-h-[80px] whitespace-pre-wrap"></div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-amber-700 mb-1">
                    <i class="fas fa-sync-alt mr-1"></i>ยาต่อเนื่อง (Continuous Order)
                </label>
                <div id="viewContinuous" class="bg-white border border-gray-200 rounded-lg p-3 text-base text-gray-800 font-mono min-h-[100px] whitespace-pre-wrap"></div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">
                    <i class="fas fa-user-md mr-1"></i>แผนแรกรับ (Plan/Management)
                </label>
                <div id="viewPlanMx" class="bg-white border border-gray-200 rounded-lg p-3 text-base text-gray-800 min-h-[80px] whitespace-pre-wrap"></div>
            </div>
        </div>
        
        <div class="flex justify-end space-x-3 mt-6">
            <button type="button" data-action="closeAdmissionOrdersViewModal"
                class="px-5 py-3 bg-gray-100 text-gray-800 rounded-lg hover:bg-gray-200 font-bold">
                ปิด
            </button>
        </div>
    </div>
</div>
